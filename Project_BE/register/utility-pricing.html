<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Điện nước | MiniStay</title><link rel="stylesheet" href="properties.css"><link rel="stylesheet" href="navigation.css"><script defer src="navigation.js"></script></head><body><header class="topbar"><a class="brand" href="properties.html">MiniStay</a></header><main class="container"><h1>Tính điện/nước</h1><p>Chỉ số đã ghi và giá có chứng cứ được dùng cho kỳ hóa đơn.</p><form class="panel" id="previewForm"><label>Hợp đồng <select id="contract" required></select></label> <label>Kỳ <input id="period" type="month" required></label> <button class="button button-primary">Xem tính tiền</button></form><p id="message" role="status" aria-live="polite"></p><section id="result" class="panel" hidden></section><p><a id="issueLink" href="invoices.html" hidden>Chốt hóa đơn</a> · <a href="rooms.html">Quản lý phòng</a></p><details class="panel"><summary>Thêm lịch sử giá có chứng cứ</summary><form id="priceForm"><label>Cơ sở <select id="property" required></select></label> <label>Phạm vi <select id="scope"><option value="property">Khu trọ</option><option value="room">Phòng</option><option value="contract">Hợp đồng</option></select></label> <label>Mã phòng/hợp đồng (nếu chọn) <input id="target" type="number" min="1"></label> <label>Loại <select id="utility"><option value="electricity">Điện</option><option value="water">Nước</option></select></label> <label>Đơn giá <input id="price" type="number" min="0" step="1" required></label> <label>Hiệu lực từ <input id="from" type="date" required></label> <label>đến <input id="to" type="date" required></label> <label>Căn cứ <input id="evidence" minlength="3" maxlength="500" required></label> <button class="button button-primary">Lưu giá</button></form><p id="priceMessage" role="status"></p><button id="historyBtn" class="button button-outline" type="button">Xem lịch sử giá cơ sở</button><div id="history"></div></details></main><script src="utility-pricing.js"></script></body></html>
