<main class="container">
<h1>Chốt hóa đơn hàng tháng</h1>
<p>Tiền phòng tính đủ một tháng. Phí dịch vụ lấy từ các dịch vụ đã gán cho phòng hoặc hợp đồng.</p>
<form id="invoiceForm" class="panel">
<label>Tháng <input type="month" id="period" required></label>
<label>Hợp đồng <select id="contract" required></select></label>
<button type="submit" class="button">Chốt hóa đơn</button>
</form>
<p id="notice" role="status" aria-live="polite"></p>
<section class="panel"><h2>Hóa đơn đã chốt</h2><div id="invoices"></div></section>
</main><script src="invoices.js"></script>
