<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>
      Hóa đơn | MiniStay
    </title>
    <link href="properties.css" rel="stylesheet"/>
    <link href="invoices.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="properties.html">
        MiniStay
      </a>
      <a href="contracts.html">
        Hợp đồng
      </a>
      <a href="login.html">
        Tài khoản
      </a>
    </header>
    <main class="container">
      <h1 id="pageTitle">
        Chốt hóa đơn hàng tháng
      </h1>
      <p id="pageDescription">
        Tiền phòng tính đủ một tháng. Phí dịch vụ lấy từ các dịch vụ đã gán cho phòng hoặc hợp đồng.
      </p>
      <form class="panel" id="invoiceForm">
        <label>
          Tháng
          <input id="period" required="" type="month"/>
        </label>
        <label>
          Hợp đồng
          <select id="contract" required="">
          </select>
        </label>
        <button class="button" type="submit">
          Chốt hóa đơn
        </button>
      </form>
      <p aria-live="polite" id="notice" role="status">
      </p>
      <section class="panel">
        <h2>
          Hóa đơn đã chốt
        </h2>
        <div id="invoices">
        </div>
      </section>
      <section aria-live="polite" class="invoice-document panel" hidden="" id="invoiceDocument">
      </section>
    </main>
    <script src="invoices.js">
    </script>
  </body>
</html>
