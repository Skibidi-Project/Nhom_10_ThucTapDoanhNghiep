<!doctype html>
<html lang="vi">

<head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chốt hóa đơn | MiniStay</title>
    <link rel="stylesheet" href="../css/properties.css">
    <link rel="stylesheet" href="../css/invoices.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <script defer src="../js/navigation.js"></script>
</head>

<body>
    <header class="topbar invoice-topbar"><a class="brand" href="properties.html">MiniStay</a>
        <nav class="guest-actions" aria-label="Điều hướng"><a href="contracts.html">Hợp đồng</a><a
                href="login.html">Đăng nhập</a></nav>
    </header>
   
    <main class="container invoice-page">
        <section class="invoice-intro">
            <p class="eyebrow">Quản lý thanh toán</p>
            <h1>Chốt hóa đơn hàng tháng</h1>
            <p class="subtitle">Tiền phòng tính đủ một tháng. Phí dịch vụ lấy từ các dịch vụ đã gán cho phòng hoặc hợp
                đồng.</p>
        </section>
        <p id="notice" class="invoice-notice" role="status" aria-live="polite"></p>
        <form id="invoiceForm" class="panel invoice-form">
            <div class="invoice-form-heading">
                <h2>Tạo hóa đơn</h2>
                <p>Chọn kỳ thanh toán và hợp đồng đang hoạt động.</p>
            </div>
            <label for="period">Tháng <input type="month" id="period" required></label>
            <label for="contract">Hợp đồng <select id="contract" required></select></label>
            <button type="submit" class="button button-primary">Chốt hóa đơn</button>
        </form>
        <section class="panel invoice-history">
            <div class="invoice-history-heading">
                <h2>Hóa đơn đã chốt</h2>
                <p>Các hóa đơn đã tạo trong phạm vi tài khoản của bạn.</p>
            </div>
            <div id="invoices" class="invoice-list"></div>
        </section>
    </main>
    <script src="../js/invoices.js"></script>
</body>

</html>
