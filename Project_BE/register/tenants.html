<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      Khách thuê | MiniStay
    </title>
    <link href="properties.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="properties.html">
        MiniStay
      </a>
      <nav class="topbar-actions">
        <a class="button button-light" href="properties.html">
          Quản lý cơ sở
        </a>
        <a class="button button-light" href="contracts.html">
          Hợp đồng
        </a>
        <a class="button button-light" href="login.html">
          Đăng nhập
        </a>
      </nav>
    </header>
    <main class="container">
      <h1>
        Hồ sơ khách thuê
      </h1>
      <p aria-live="polite" id="notice" role="status">
      </p>
      <section hidden="" id="tenantSection">
        <form class="panel" id="tenantForm">
          <h2 id="formTitle">
            Thêm khách thuê
          </h2>
          <label class="form-group">
            Họ tên
            <input maxlength="120" name="full_name" required=""/>
          </label>
          <label class="form-group">
            Số điện thoại
            <input name="phone" pattern="0[0-9]{9}" required="" type="tel"/>
          </label>
          <label class="form-group">
            CCCD/CMND
            <input inputmode="numeric" name="id_number" pattern="[0-9]{9,12}" required=""/>
          </label>
          <label class="form-group">
            Ngày cấp
            <input name="id_issue_date" type="date"/>
          </label>
          <label class="form-group">
            Nơi cấp
            <input maxlength="255" name="id_issue_place"/>
          </label>
          <label class="form-group">
            Quê quán
            <input maxlength="255" name="hometown"/>
          </label>
          <label class="form-group" hidden="" id="propertyField">
            Khu trọ
            <select name="property_id">
            </select>
          </label>
          <button class="button" type="submit">
            Lưu hồ sơ
          </button>
          <button class="button button-outline" hidden="" id="cancelEdit" type="button">
            Hủy chỉnh sửa
          </button>
        </form>
        <section class="panel">
          <h2>
            Danh sách khách thuê
          </h2>
          <div id="tenantList">
          </div>
        </section>
      </section>
    </main>
    <script src="tenants.js">
    </script>
  </body>
</html>
