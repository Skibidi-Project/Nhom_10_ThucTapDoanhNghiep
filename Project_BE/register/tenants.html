<!doctype html>
<html lang="vi">
<head><link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khách thuê | MiniStay</title>
    <link rel="stylesheet" href="properties.css">
    <link rel="stylesheet" href="tenants.css">
<link rel="stylesheet" href="navigation.css"><script defer src="navigation.js"></script></head>
<body>
    <header class="topbar">
        <a class="brand" href="properties.html">MiniStay</a>
        <nav class="topbar-actions">
            <a class="button button-light" href="properties.html">Quản lý cơ sở</a>
            <a class="button button-light" href="contracts.html">Hợp đồng</a>
            <a class="button button-light" href="login.html">Đăng nhập</a>
        </nav>
    </header>
    <main class="container">
        <h1>Hồ sơ khách thuê</h1>
        <p id="notice" role="status" aria-live="polite"></p>
        <section id="tenantSection" hidden>
            <form id="tenantForm" class="panel">
                <h2 id="formTitle">Thêm khách thuê</h2>
                <label class="form-group">Họ tên <input name="full_name" required maxlength="120"></label>
                <label class="form-group">Số điện thoại <input name="phone" type="tel" required pattern="0[0-9]{9}"></label>
                <label class="form-group">CCCD/CMND <input name="id_number" required inputmode="numeric" pattern="[0-9]{9,12}"></label>
                <label class="form-group">Ngày cấp <input name="id_issue_date" type="date"></label>
                <label class="form-group">Nơi cấp <input name="id_issue_place" maxlength="255"></label>
                <label class="form-group">Quê quán <input name="hometown" maxlength="255"></label>
                <label class="form-group" id="propertyField" hidden>Khu trọ <select name="property_id"></select></label>
                <button class="button" type="submit">Lưu hồ sơ</button>
                <button class="button button-outline" id="cancelEdit" type="button" hidden>Hủy chỉnh sửa</button>
            </form>
            <section class="panel">
                <h2>Danh sách khách thuê</h2>
                <div class="tenant-search">
                    <input id="tenantSearch" type="search" maxlength="50" placeholder="Tìm theo tên, CCCD hoặc số điện thoại" aria-label="Tìm khách thuê">
                    <button id="clearTenantSearch" type="button" class="button button-outline" hidden>Xóa</button>
                </div>
                <p id="tenantResultCount" class="tenant-result-count" aria-live="polite">0 khách thuê</p>
                <div id="tenantList"></div>
                <div id="tenantPagination" class="tenant-pagination" hidden>
                    <button id="tenantPreviousBtn" type="button" class="button button-outline">Trước</button>
                    <span id="tenantPageInfo">Trang 1/1</span>
                    <button id="tenantNextBtn" type="button" class="button button-outline">Sau</button>
                </div>
            </section>
        </section>
    </main>
    <script src="tenants.js"></script>
</body>
</html>
