<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghi chỉ số điện nước - MiniStay</title><link rel="stylesheet" href="properties.css"><link rel="stylesheet" href="rooms.css"></head><body>
<header class="topbar"><a class="brand" href="properties.html">MiniStay</a><div class="topbar-actions"><a class="button button-light" href="rooms.html">Quản lý phòng</a></div></header>
<main class="container"><section class="intro"><div><h1>Ghi chỉ số điện/nước</h1><p class="subtitle">Chỉ số theo phòng và kỳ ghi.</p></div><a class="button button-outline" href="rooms.html">Quay lại</a></section>
<div id="notice" class="notice" role="status"></div>
<section class="panel"><div class="form-grid"><div class="form-group"><label for="property">Khu trọ</label><select id="property"></select></div><div class="form-group"><label for="room">Phòng</label><select id="room"></select></div><div class="form-group"><label for="period">Kỳ ghi</label><input id="period" type="month"></div><div class="form-group"><label for="type">Loại</label><select id="type"><option value="electricity">Điện</option><option value="water">Nước</option></select></div></div>
<form id="readingForm"><div class="form-grid"><div class="form-group"><label for="previous">Chỉ số cũ</label><input id="previous" type="number" min="0" max="2147483647" step="1" required></div><div class="form-group"><label for="current">Chỉ số mới</label><input id="current" type="number" min="0" max="2147483647" step="1" required></div></div><p id="consumption">Tiêu thụ: —</p><button class="button button-primary" id="save" type="submit">Lưu chỉ số</button> <button class="button button-light" id="cancel" type="button" hidden>Hủy sửa</button></form></section>
<section class="panel"><h2>Lịch sử chỉ số</h2><div class="table-scroll"><table class="room-table"><thead><tr><th>Kỳ</th><th>Loại</th><th>Chỉ số cũ</th><th>Chỉ số mới</th><th>Thao tác</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script src="readings.js"></script></body></html>
